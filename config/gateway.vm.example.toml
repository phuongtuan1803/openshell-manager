# OpenShell development gateway template (example only).
# Copy only after running preflight and validating the installed OpenShell version.
# OpenShell VM is opt-in; this file is NOT loaded just because it is in the repo.
[openshell]
version = 2

[openshell.gateway]
# Do not expose the gateway on a public interface.
bind_address = "127.0.0.1:17670"
compute_driver = "vm"

[openshell.drivers.vm]
# OpenShell 0.1.2 installed package path; verify before using another release.
driver_dir = "/usr/libexec/openshell"
# The default boots a minimal guest; it does not contain coding tools.
# --from base means docker.io/library/base:latest, not this default.
default_image = "nvcr.io/nvidia/base/ubuntu:24.04"
# Review a development image separately and select it explicitly with --from.
vcpus = 2
mem_mib = 4096
overlay_disk_mib = 8192
