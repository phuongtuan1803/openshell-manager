# Canonical OpenShell 0.1.2 profile; setup.sh reconciles it automatically.
# Git ref restrictions are enforced by the application, not HTTP body inspection.
id: example-github
display_name: Example GitHub
description: Example Git fetch/push and REST PR creation/update; no merge endpoint
category: source_control
credentials:
  - name: api_token
    description: Repository-scoped GitHub credential managed by the gateway
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: GET, path: "/repos/example/project"}
      - allow: {method: GET, path: "/repos/example/project/**"}
      - allow: {method: POST, path: "/repos/example/project/pulls"}
      - allow: {method: PATCH, path: "/repos/example/project/pulls/*"}
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: GET, path: "/example/project.git/info/refs"}
      - allow: {method: POST, path: "/example/project.git/git-upload-pack"}
      - allow: {method: POST, path: "/example/project.git/git-receive-pack"}
binaries: [/sandbox/tools/gh, /usr/bin/gh, /usr/bin/git]
